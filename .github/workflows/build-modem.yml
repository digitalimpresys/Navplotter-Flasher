# Temporary: builds the Heltec V2 modem image once and commits it to this branch.
name: Build Heltec V2 modem image

on:
  push:
    branches: [heltec-v2-modem]
    paths: [.github/workflows/build-modem.yml]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: digitalimpresys/Navplotter-Linux
          ref: firmware/heltec-modem
          path: navplotter-linux
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install platformio
      - run: pio run -d navplotter-linux/firmware/heltec-modem
      - name: Merge the image and write the manifest
        run: |
          B=navplotter-linux/firmware/heltec-modem/.pio/build/heltec_wifi_lora_32_V2
          python ~/.platformio/packages/tool-esptoolpy/esptool.py --chip esp32 merge_bin -o firmware/heltec-v2-modem.bin \
            0x1000 $B/bootloader.bin 0x8000 $B/partitions.bin \
            0xe000 ~/.platformio/packages/framework-arduinoespressif32/tools/partitions/boot_app0.bin \
            0x10000 $B/firmware.bin
          python - <<'PY'
          import json, os, re
          src = open("navplotter-linux/firmware/heltec-modem/src/main.cpp").read()
          version = re.search(r'#define\s+FIRMWARE_VERSION\s+"([^"]+)"', src).group(1)
          bid, name = "heltec-v2-modem", "NavPlotter Linux modem, Heltec V2"
          manifest = {"name": name, "version": version, "new_install_prompt_erase": True,
                      "builds": [{"chipFamily": "ESP32", "parts": [{"path": bid + ".bin", "offset": 0}]}]}
          json.dump(manifest, open("firmware/%s.json" % bid, "w"), indent=1)
          versions = [v for v in json.load(open("firmware/versions.json")) if v["id"] != bid]
          at = next(i + 1 for i, v in enumerate(versions) if v["id"] == "heltec-v2-segnalatore")
          versions.insert(at, {"id": bid, "name": name, "version": version, "size": os.path.getsize("firmware/%s.bin" % bid)})
          json.dump(versions, open("firmware/versions.json", "w"), indent=1)
          PY
      - name: Commit the image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add firmware/heltec-v2-modem.bin firmware/heltec-v2-modem.json firmware/versions.json
          git commit -m "Heltec V2 modem image, built by GitHub Actions"
          git push
